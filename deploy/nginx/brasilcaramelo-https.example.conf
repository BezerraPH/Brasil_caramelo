# HTTPS na LAN — use scripts/setup-https-lan.sh (automatiza cópia + nginx + .env)
#
# Portas:
#   443  → app Next.js :3000
#   7443 → LiveKit WSS  :7880
#   6443 → Soketi WSS   :6001
#   80   → redireciona para HTTPS

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name brasilcaramelo.com www.brasilcaramelo.com 192.168.1.4;

    ssl_certificate     /etc/ssl/certs/brasilcaramelo.pem;
    ssl_certificate_key /etc/ssl/private/brasilcaramelo.key;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 7443 ssl;
    listen [::]:7443 ssl;
    server_name brasilcaramelo.com www.brasilcaramelo.com 192.168.1.4;

    ssl_certificate     /etc/ssl/certs/brasilcaramelo.pem;
    ssl_certificate_key /etc/ssl/private/brasilcaramelo.key;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

server {
    listen 6443 ssl;
    listen [::]:6443 ssl;
    server_name brasilcaramelo.com www.brasilcaramelo.com 192.168.1.4;

    ssl_certificate     /etc/ssl/certs/brasilcaramelo.pem;
    ssl_certificate_key /etc/ssl/private/brasilcaramelo.key;

    location / {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name brasilcaramelo.com www.brasilcaramelo.com 192.168.1.4;
    return 301 https://$host$request_uri;
}
