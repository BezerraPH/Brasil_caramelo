services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: caramelo
      POSTGRES_PASSWORD: caramelo_secret
      POSTGRES_DB: brasil_caramelo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caramelo -d brasil_caramelo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://caramelo:caramelo_secret@db:5432/brasil_caramelo
      NODE_ENV: production
      # HTTP na rede local (192.168.x): false. Com HTTPS reverso: true
      COOKIE_SECURE: "false"
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
      NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-us2}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_KEY: ${PUSHER_KEY:-}
      PUSHER_SECRET: ${PUSHER_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EVENT_ADMIN_SECRET: ${EVENT_ADMIN_SECRET:-}
      PREMIUM_CODE: ${PREMIUM_CODE:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
