# Gitea — Git com interface web
# Web: http://192.168.1.4:3001  |  Tailscale: http://100.94.55.27:3001
# Git SSH: porta 2222 (não use a 22 do sistema para push do Gitea)

services:
  gitea:
    image: gitea/gitea:1.22
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN=192.168.1.4
      - GITEA__server__SSH_DOMAIN=192.168.1.4
      - GITEA__server__ROOT_URL=http://192.168.1.4:3001/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__DISABLE_SSH=false
      - GITEA__server__START_SSH_SERVER=true
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data

volumes:
  gitea-data:
