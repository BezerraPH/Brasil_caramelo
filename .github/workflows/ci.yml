name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://caramelo:caramelo_secret@localhost:5432/brasil_caramelo
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caramelo
          POSTGRES_PASSWORD: caramelo_secret
          POSTGRES_DB: brasil_caramelo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caramelo -d brasil_caramelo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run build

  smoke-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/validate-smoke-tests.sh
